<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 24" width="288" height="96">
  <!-- Vorlage DESIGN.md 12.16: drei neue Reiter-Symbole im Stil von src/ui/symbole.ts (24er-Raster, Umriss #1a1208, 1,6 px, runde Enden). Je 24 px breit nebeneinander: sonne | rohr | baum -->
