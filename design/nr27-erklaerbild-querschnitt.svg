<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 176 132" width="352" height="264" role="img" aria-label="Skizze: Längsschnitt der Bahnquerung – Startgrube mit Bohrgerät, Schutzrohr unter zwei Gleisen, Zielgrube">
  <!-- NR27 Erklärkarte, Skizze für das Bild links (176×132 px). Farben = Token-Vorschlag DESIGN.md 14.9. Kein fertiges Asset: Der Projektleiter zeichnet es mit denselben Farben im Canvas (wie src/ui/bild.ts) oder übernimmt diese Datei. -->
  <rect width="176" height="132" rx="8" fill="#d6eaff"/>
  <!-- Erdreich -->
  <rect x="0" y="62" width="176" height="70" fill="#8a6a4e"/>
  <rect x="0" y="58" width="176" height="6" fill="#8dcc55"/>
  <!-- Schotterbett mit zwei Gleisen -->
  <path d="M44 62 L56 48 L120 48 L132 62 Z" fill="#8f887d"/>
  <path d="M44 62 L56 48 L58 48 L47 62 Z" fill="#6f675c"/>
  <path d="M132 62 L120 48 L118 48 L129 62 Z" fill="#6f675c"/>
  <rect x="60" y="45" width="24" height="4" rx="1" fill="#cfcac0"/>
  <rect x="92" y="45" width="24" height="4" rx="1" fill="#cfcac0"/>
  <rect x="63" y="41" width="4" height="4" fill="#333b41"/><rect x="77" y="41" width="4" height="4" fill="#333b41"/>
  <rect x="95" y="41" width="4" height="4" fill="#333b41"/><rect x="109" y="41" width="4" height="4" fill="#333b41"/>
  <!-- Zaun beidseits -->
  <g stroke="#55605b" stroke-width="1.5"><line x1="38" y1="58" x2="38" y2="48"/><line x1="138" y1="58" x2="138" y2="48"/></g>
  <!-- Startgrube links mit Verbau und Bohrgerät -->
  <rect x="6" y="64" width="28" height="44" fill="#5f4532"/>
  <rect x="6" y="64" width="3" height="44" fill="#e8c48a"/><rect x="31" y="64" width="3" height="44" fill="#e8c48a"/>
  <rect x="10" y="90" width="18" height="10" rx="2" fill="#f0a53a" stroke="#3b1d0a" stroke-width="1"/>
  <rect x="12" y="86" width="7" height="5" rx="1" fill="#2f3d48"/>
  <!-- Zielgrube rechts -->
  <rect x="146" y="64" width="22" height="44" fill="#5f4532"/>
  <rect x="146" y="64" width="3" height="44" fill="#e8c48a"/><rect x="165" y="64" width="3" height="44" fill="#e8c48a"/>
  <!-- Schutzrohr (Rohr im Rohr) unter den Gleisen -->
  <rect x="28" y="92" width="122" height="8" rx="4" fill="#dfe5e8" stroke="#2f3a40" stroke-width="2"/>
  <rect x="30" y="94.5" width="118" height="3" rx="1.5" fill="#ff8a1f"/>
