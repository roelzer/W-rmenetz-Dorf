  <g><rect x="18" y="44" width="3" height="14" fill="#f4f1ea" stroke="#3b1d0a" stroke-width=".6"/><rect x="18" y="44" width="3" height="3" fill="#ff8a1f"/></g>
  <g><rect x="155" y="44" width="3" height="14" fill="#f4f1ea" stroke="#3b1d0a" stroke-width=".6"/><rect x="155" y="44" width="3" height="3" fill="#ff8a1f"/></g>
  <!-- Zug fährt weiter (nur Umriss) -->
  <rect x="56" y="18" width="64" height="23" rx="5" fill="#f3eee3" stroke="#3b1d0a" stroke-width="1.2"/>
  <rect x="60" y="22" width="56" height="7" rx="2" fill="#2f3d48"/>
  <rect x="56" y="34" width="32" height="3" fill="#ff8a1f"/><rect x="88" y="34" width="32" height="3" fill="#3a92ea"/>
