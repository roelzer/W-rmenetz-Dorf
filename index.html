<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#3f7a2f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Heatville">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>Heatville</title>
<style>
#drehen[hidden],#startstatus[hidden]{display:none!important}
#startstatus{position:fixed;inset:0;z-index:90;display:grid;place-content:center;text-align:center;padding:24px;background:#101c34;color:#e5efff;font:16px system-ui,sans-serif}
#startstatus strong{color:#ffd28d;font-size:clamp(28px,8vw,44px)}
#startstatus button{justify-self:center;padding:10px 18px;border:0;border-radius:10px;background:#ffd28d;color:#101c34;font:inherit;font-weight:700}
</style>
</head>
<body>
<div id="app">
<div id="drehen" hidden role="alert"><p>Bitte drehe dein Handy ins Querformat.</p></div><canvas id="karte" role="img" aria-label="Dorfkarte mit Heizzentrale, Häusern und Wärmeleitungen"></canvas></div>
<section id="startstatus" aria-label="Heatville startet">
<strong>Heatville</strong>
<p id="startmeldung" role="status">Spiel wird geladen …</p>
<button id="start-neuladen" type="button" hidden>Neu laden</button>
</section>
<script>
  setTimeout(() => {
    if (document.getElementById('startstatus').hidden) return;
    document.getElementById('startmeldung').textContent = 'Heatville konnte nicht starten. Prüfe die Internetverbindung und lade das Spiel neu.';
    document.getElementById('start-neuladen').hidden = false;
  }, 6000);
  document.getElementById('start-neuladen').addEventListener('click', () => location.reload());
</script>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
